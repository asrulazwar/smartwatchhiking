name: build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build debug APKs
        run: ./gradlew --no-daemon :wear:assembleDebug :mobile:assembleDebug :wear:assembleRelease :mobile:assembleRelease

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest :shared:test

      - name: Upload wear-debug
        uses: actions/upload-artifact@v4
        with:
          name: wear-debug
          path: wear/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload mobile-debug
        uses: actions/upload-artifact@v4
        with:
          name: mobile-debug
          path: mobile/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload wear-release
        uses: actions/upload-artifact@v4
        with:
          name: wear-release
          path: wear/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload mobile-release
        uses: actions/upload-artifact@v4
        with:
          name: mobile-release
          path: mobile/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore

  # Terbitkan APK debug ke prerelease bergulir "apk-latest" agar mudah diunduh tanpa login
  # (artefak Actions butuh login dan dilayani dari host yang sering diblokir proxy).
  release:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wear-debug
          path: apk/wear
      - uses: actions/download-artifact@v4
        with:
          name: mobile-debug
          path: apk/mobile
      - uses: actions/download-artifact@v4
        with:
          name: wear-release
          path: apk/wear-release
      - uses: actions/download-artifact@v4
        with:
          name: mobile-release
          path: apk/mobile-release
      - name: Rename APKs
        run: |
          mv apk/wear/*.apk pendaki-wear-debug.apk
          mv apk/mobile/*.apk pendaki-mobile-debug.apk
          mv apk/wear-release/*.apk pendaki-wear-release.apk
          mv apk/mobile-release/*.apk pendaki-mobile-release.apk
          ls -la *.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: APK debug terbaru (${{ github.sha }})
          body: "Build otomatis dari ${{ github.ref_name }} @ ${{ github.sha }}. Pasang lewat ADB (lihat README)."
          prerelease: true
          files: |
            pendaki-wear-debug.apk
            pendaki-mobile-debug.apk
            pendaki-wear-release.apk
            pendaki-mobile-release.apk
